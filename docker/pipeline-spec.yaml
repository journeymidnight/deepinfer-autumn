# Paste this as the DeepInfer pipeline's spec in the CP console.
# CP's API has no create-pipeline endpoint (only delete/list/run/cancel/webhook),
# so the pipeline itself has to be created by hand; once it exists, volc-cp can
# start runs and read logs.
#
# Modeled line-for-line on the autumn-rs pipeline in the same workspace
# (dongmao-workspace / cfe78231fc4a4b3fa85ebf76d9608f43), which succeeds today.
version: 1.0.0
agentPool: public/prod-v2-public
sources:
    # Source 1: this repo (Dockerfile, the csrc patch, autumn_pd).
    - name: deepinfer_autumn
      type: Github
      url: https://github.com/journeymidnight/deepinfer-autumn.git
      branch: main
      credential:
        type: serviceConnection
        serviceConnectionId: lZoCJ9fJe0TyKPhA2DFB
      cloneDepth: 1
    # Source 2: upstream DeepInfer, pinned. CP clones it through the service
    # connection, so the build never has to reach github itself.
    - name: deepinfer_upstream
      type: Github
      url: https://github.com/deepseek-ai/DeepInfer.git
      branch: main
      credential:
        type: serviceConnection
        serviceConnectionId: lZoCJ9fJe0TyKPhA2DFB
      cloneDepth: 1
stages:
    - stage: build
      displayName: build DeepInfer + autumn PD
      tasks:
        - task: image
          displayName: 镜像构建推送至镜像仓库
          timeout: 3h
          steps:
            - step: buildkit
              displayName: 镜像构建推送至镜像仓库服务
              component: build@2.0.0/buildkit-cr@5.0.0
              inputs:
                buildParams: --build-arg APT_MIRROR=https://mirrors.ivolces.com --build-arg PIP_INDEX_URL=https://mirrors.ivolces.com/pypi/simple
                cacheType: default
                compression: gzip
                contextPath: .
                disableSSLVerify: true
                dockerfiles:
                    default:
                        path: docker/Dockerfile
                loginCredential: []
                namespace: dongmao-test
                nydusify: false
                region: cn-beijing
                registryInstance: dongmao-test
                repo: deepinfer-autumn
                tag: ${SCM_COMMIT_ID}
                useCache: true
          outputs:
            - imageOutput_buildkit
          workspace:
            resources:
                - ref: deepinfer_autumn
                  directory: $(CP_WORKSPACE)
                - ref: deepinfer_upstream
                  directory: $(CP_WORKSPACE)/DeepInfer
          resourcesPolicy: all
          resources:
            limits:
                cpu: 32C
                memory: 128Gi
